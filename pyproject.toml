[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pdf-ingest"
version = "0.1.0"
description = "Windows PDF ingestion watcher using PyMuPDF and Gemini"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PyMuPDF>=1.26,<2",
  "google-genai>=1.75,<2",
  "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.scripts]
rag-pdf = "rag_pdf_ingest.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
